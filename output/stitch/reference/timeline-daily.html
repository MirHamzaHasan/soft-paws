<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarkLog - Timeline Daily</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#adb3b4",
                        "surface-dim": "#d4dbdd",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#2d3435",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-container": "#505252",
                        "secondary-container": "#e2e2e2",
                        "inverse-surface": "#0c0f0f",
                        "on-secondary-fixed": "#3e403f",
                        "secondary": "#5e5f5f",
                        "error-container": "#fe8983",
                        "on-primary-fixed": "#403f3f",
                        "primary-fixed-dim": "#d7d4d3",
                        "error": "#9f403d",
                        "primary-container": "#e5e2e1",
                        "surface": "#f9f9f9",
                        "on-surface-variant": "#5a6061",
                        "on-surface": "#2d3435",
                        "on-error-container": "#752121",
                        "surface-container-low": "#f2f4f4",
                        "on-secondary-fixed-variant": "#5a5c5b",
                        "inverse-primary": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#f5f3f2",
                        "tertiary-dim": "#535352",
                        "tertiary-fixed": "#f5f3f2",
                        "primary": "#5f5e5e",
                        "surface-tint": "#5f5e5e",
                        "tertiary-fixed-dim": "#e7e5e4",
                        "primary-dim": "#535252",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#494a49",
                        "on-secondary": "#f9f9f8",
                        "on-primary-fixed-variant": "#5c5b5b",
                        "surface-container": "#ebeeef",
                        "background": "#f9f9f9",
                        "on-tertiary": "#fbf8f7",
                        "on-primary-container": "#525151",
                        "on-tertiary-fixed-variant": "#666665",
                        "on-error": "#fff7f6",
                        "surface-container-highest": "#dde4e5",
                        "secondary-fixed-dim": "#d4d4d3",
                        "on-primary": "#faf7f6",
                        "inverse-on-surface": "#9c9d9d",
                        "error-dim": "#4e0309",
                        "surface-container-high": "#e4e9ea",
                        "tertiary": "#5f5f5e",
                        "on-tertiary-container": "#5c5c5b",
                        "secondary-dim": "#525353",
                        "outline": "#757c7d",
                        "surface-variant": "#dde4e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24 pt-16">
<!-- TopAppBar -->
<header class="bg-[#FAFAFA]/80 dark:bg-[#0A0A0A]/80 backdrop-blur-xl border-b-[0.5px] border-[#E7E5E4] dark:border-[#262626] fixed top-0 w-full z-50">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<button class="text-[#0A0A0A] dark:text-[#FAFAFA] hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-inter font-medium text-lg text-[#0A0A0A] dark:text-[#FAFAFA] uppercase tracking-widest">BarkLog</span>
<div class="w-6"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="max-w-screen-md mx-auto px-6 py-8">
<!-- Header -->
<div class="mb-8">
<h1 class="font-headline font-medium text-[28px] tracking-tight mb-6">Timeline</h1>
<!-- Date Pills -->
<div class="flex overflow-x-auto hide-scrollbar gap-3 pb-2 -mx-6 px-6">
<button class="flex flex-col items-center min-w-[48px] opacity-60 hover:opacity-100 transition-opacity">
<span class="font-label font-medium text-[11px] uppercase tracking-tighter text-on-surface-variant">Mon</span>
<span class="font-body text-base mt-1">12</span>
</button>
<button class="flex flex-col items-center min-w-[48px] opacity-60 hover:opacity-100 transition-opacity">
<span class="font-label font-medium text-[11px] uppercase tracking-tighter text-on-surface-variant">Tue</span>
<span class="font-body text-base mt-1">13</span>
</button>
<button class="flex flex-col items-center min-w-[48px]">
<span class="font-label font-medium text-[11px] uppercase tracking-tighter text-on-background">Wed</span>
<div class="w-8 h-8 rounded-full bg-[#0A0A0A] text-[#FAFAFA] flex items-center justify-center mt-1">
<span class="font-body text-base">14</span>
</div>
</button>
<button class="flex flex-col items-center min-w-[48px] opacity-60 hover:opacity-100 transition-opacity">
<span class="font-label font-medium text-[11px] uppercase tracking-tighter text-on-surface-variant">Thu</span>
<span class="font-body text-base mt-1">15</span>
</button>
<button class="flex flex-col items-center min-w-[48px] opacity-60 hover:opacity-100 transition-opacity">
<span class="font-label font-medium text-[11px] uppercase tracking-tighter text-on-surface-variant">Fri</span>
<span class="font-body text-base mt-1">16</span>
</button>
<button class="flex flex-col items-center min-w-[48px] opacity-60 hover:opacity-100 transition-opacity">
<span class="font-label font-medium text-[11px] uppercase tracking-tighter text-on-surface-variant">Sat</span>
<span class="font-body text-base mt-1">17</span>
</button>
</div>
</div>
<!-- Timeline Events -->
<div class="relative pl-6">
<!-- Timeline Line -->
<div class="absolute left-[33px] top-4 bottom-4 w-[0.5px] bg-[#E7E5E4] z-0"></div>
<!-- Event List -->
<div class="flex flex-col gap-6 relative z-10">
<!-- Event: Walk -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#FFF9E6] border-[0.5px] border-[#FFECB3] flex items-center justify-center shrink-0">
<span class="text-lg">🐾</span>
</div>
<div class="flex-1 flex justify-between items-baseline border-b-[0.5px] border-[#E7E5E4] pb-3">
<div>
<p class="font-headline font-medium text-base text-[#7A5500]">Morning Walk</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">1.2 miles • energetic</p>
</div>
<span class="font-label font-medium text-[11px] text-on-surface-variant uppercase tracking-tighter">07:30 AM</span>
</div>
</div>
<!-- Event: Meal -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#F2F8F1] border-[0.5px] border-[#D9EAD3] flex items-center justify-center shrink-0">
<span class="text-lg">🦴</span>
</div>
<div class="flex-1 flex justify-between items-baseline border-b-[0.5px] border-[#E7E5E4] pb-3">
<div>
<p class="font-headline font-medium text-base text-[#1B5E20]">Breakfast</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">1 cup kibble</p>
</div>
<span class="font-label font-medium text-[11px] text-on-surface-variant uppercase tracking-tighter">08:15 AM</span>
</div>
</div>
<!-- Event: Meds (Soft Purple) -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#F5F3FF] border-[0.5px] border-[#DDD6FE] flex items-center justify-center shrink-0">
<span class="text-lg">💊</span>
</div>
<div class="flex-1 flex justify-between items-baseline border-b-[0.5px] border-[#E7E5E4] pb-3 rounded-lg bg-[#F5F3FF]/50 px-3 -ml-3">
<div>
<p class="font-headline font-medium text-base text-[#4C1D95]">Heartworm Meds</p>
<p class="font-body text-sm text-[#4C1D95]/70 mt-0.5">Monthly tablet</p>
</div>
<span class="font-label font-medium text-[11px] text-[#4C1D95]/70 uppercase tracking-tighter">08:20 AM</span>
</div>
</div>
<!-- Event: Poop -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#FDF4F3] border-[0.5px] border-[#F9DEDC] flex items-center justify-center shrink-0">
<span class="text-lg">💩</span>
</div>
<div class="flex-1 flex justify-between items-baseline border-b-[0.5px] border-[#E7E5E4] pb-3">
<div>
<p class="font-headline font-medium text-base text-[#8C1D18]">Poop</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">Normal</p>
</div>
<span class="font-label font-medium text-[11px] text-on-surface-variant uppercase tracking-tighter">02:45 PM</span>
</div>
</div>
<!-- Event: Symptom (Red left border) -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container border-[0.5px] border-[#E7E5E4] flex items-center justify-center shrink-0">
<span class="text-lg">⚠️</span>
</div>
<div class="flex-1 flex justify-between items-baseline border-b-[0.5px] border-[#E7E5E4] pb-3 border-l-2 border-l-error pl-3 -ml-[2px]">
<div>
<p class="font-headline font-medium text-base text-on-background">Lethargic</p>
<p class="font-body text-sm text-on-surface-variant mt-0.5">Didn't want to play</p>
</div>
<span class="font-label font-medium text-[11px] text-on-surface-variant uppercase tracking-tighter">05:00 PM</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-[#FAFAFA]/80 dark:bg-[#0A0A0A]/80 backdrop-blur-xl border-t-[0.5px] border-[#E7E5E4] dark:border-[#262626] fixed bottom-0 w-full z-50 pb-safe md:hidden">
<div class="flex justify-around items-center h-20 px-4 w-full">
<button class="flex flex-col items-center justify-center text-[#A8A29E] dark:text-[#57534E] opacity-60 hover:opacity-100 transition-all">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter">Archive</span>
</button>
<button class="flex flex-col items-center justify-center text-[#0A0A0A] dark:text-[#FAFAFA] opacity-100 scale-90 transition-transform duration-150">
<span class="material-symbols-outlined mb-1" data-icon="add_circle">add_circle</span>
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter">Log</span>
</button>
<button class="flex flex-col items-center justify-center text-[#A8A29E] dark:text-[#57534E] opacity-60 hover:opacity-100 transition-all">
<span class="material-symbols-outlined mb-1" data-icon="photo_library">photo_library</span>
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter">Gallery</span>
</button>
<button class="flex flex-col items-center justify-center text-[#A8A29E] dark:text-[#57534E] opacity-60 hover:opacity-100 transition-all">
<span class="material-symbols-outlined mb-1" data-icon="medical_services">medical_services</span>
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter">Meds</span>
</button>
</div>
</nav>
</body></html>
