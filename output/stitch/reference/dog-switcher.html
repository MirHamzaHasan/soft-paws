<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col font-body">
<!-- Mock Home Screen Content (Blurred/Faded in background) -->
<div class="fixed inset-0 bg-surface-container-low z-0 opacity-40 blur-sm flex flex-col items-center justify-center pointer-events-none">
<div class="w-full max-w-md p-6">
<div class="h-8 bg-surface-variant rounded-full w-1/3 mb-6"></div>
<div class="h-32 bg-surface-container-highest rounded-xl mb-4"></div>
<div class="h-24 bg-surface-container-highest rounded-xl mb-4"></div>

</div>
</div>

<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-[#0A0A0A]">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-6 py-6 space-y-4">
<!-- Active Dog Card (Max) -->
<div class="flex items-center p-4 bg-surface-container-low border-[1.5px] border-[#0A0A0A] rounded-2xl cursor-pointer transition-colors relative">
<!-- Checkmark indicating active -->
<div class="absolute -top-2 -right-2 bg-[#0A0A0A] text-[#FAFAFA] w-6 h-6 rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-sm font-bold" data-icon="check">check</span>
</div>
<img alt="Max avatar" class="w-12 h-12 rounded-full object-cover border-[0.5px] border-[#E7E5E4] mr-4 shrink-0" data-alt="Close up portrait of a cheerful beagle dog with floppy ears outdoors in soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_aI4Y62atYlYTRyivCzpiYpGUkDtGpOVf5G8Kwd7AfAiH-AuByMdrtmY5REUPFCuNapVZgZoTteJa0DOQv2UAn5-Np5MhgHoOSj092yYkTSgS_3mJNlgam2ci0AyyO9lGgW_ZTTpPcqf1IzMZzAdx8Iuf3D2LCJ6BKd7zpk04IPGSJiTf8Un8zETQR4hnr8FrsEFu1NUxM_iW50Uf8O_Wuet2e_blgT2QEUYBea-oV9RXVqU_LHl9wvokARyCRY6xehkOJxZly6k"/>
<div class="flex-1 min-w-0">

<p class="font-body font-normal text-sm text-on-surface-variant truncate">Beagle • 4 yrs</p>
</div>
<div class="text-right ml-4 shrink-0">
<span class="inline-flex items-center gap-1 px-2 py-1 bg-[#FFF9E6] border-[0.5px] border-[#FFECB3] rounded-full text-[11px] font-medium tracking-widest uppercase text-[#7A5500]">
<span class="material-symbols-outlined text-[12px]" data-icon="directions_walk">directions_walk</span>
                        Walk
                    </span>
<p class="font-label font-medium text-[11px] uppercase tracking-widest text-[#A8A29E] mt-1">2h ago</p>
</div>
</div>
<!-- Inactive Dog Card (Luna) -->
<div class="flex items-center p-4 bg-surface-container-lowest border-[0.5px] border-[#E7E5E4] rounded-2xl cursor-pointer hover:bg-surface-container-low transition-colors">
<img alt="Luna avatar" class="w-12 h-12 rounded-full object-cover border-[0.5px] border-[#E7E5E4] mr-4 shrink-0 grayscale-[20%]" data-alt="Portrait of a fluffy golden retriever dog looking softly at camera against a muted background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4NyqXr0QlaiDRxqcJEnm2f9Whev2ktfGTqKSReRQeRK7bi_hQsfaUwaeHkJqZ1PLqEAynH2Gjj85QcR2ZvVDOpu5ilmkp-0nLfImN413NCLp-TrhAadO6g3OdrC39_1fJT6MLAFrJ9LeP7omI-dJLJ1fYQ_U69ydn5DbMQdha_RdR6PRxj8qey1pubpYT55QOvf20qCsJ98GLvPrFCMwabK3QAsl1su97qE21ch-3nBQnAkIkcV-_frsv8-YxCCFf7DZaCZOFDy8"/>

</div>
<div class="text-right ml-4 shrink-0">
<span class="inline-flex items-center gap-1 px-2 py-1 bg-[#F2F8F1] border-[0.5px] border-[#D9EAD3] rounded-full text-[11px] font-medium tracking-widest uppercase text-[#1B5E20]">
<span class="material-symbols-outlined text-[12px]" data-icon="restaurant">restaurant</span>

<p class="font-label font-medium text-[11px] uppercase tracking-widest text-[#A8A29E] mt-1">5h ago</p>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="px-6 pb-8 pt-4 bg-surface-container-lowest border-t-[0.5px] border-tertiary-fixed-dim flex justify-center">
