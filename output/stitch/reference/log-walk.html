<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarkLog - Log Walk</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#adb3b4",
                    "surface-dim": "#d4dbdd",
                    "primary-fixed": "#e5e2e1",
                    "on-background": "#2d3435",
                    "secondary-fixed": "#e2e2e2",
                    "on-secondary-container": "#505252",
                    "secondary-container": "#e2e2e2",
                    "inverse-surface": "#0c0f0f",
                    "on-secondary-fixed": "#3e403f",
                    "secondary": "#5e5f5f",
                    "error-container": "#fe8983",
                    "on-primary-fixed": "#403f3f",
                    "primary-fixed-dim": "#d7d4d3",
                    "error": "#9f403d",
                    "primary-container": "#e5e2e1",
                    "surface": "#f9f9f9",
                    "on-surface-variant": "#5a6061",
                    "on-surface": "#2d3435",
                    "on-error-container": "#752121",
                    "surface-container-low": "#f2f4f4",
                    "on-secondary-fixed-variant": "#5a5c5b",
                    "inverse-primary": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "tertiary-container": "#f5f3f2",
                    "tertiary-dim": "#535352",
                    "tertiary-fixed": "#f5f3f2",
                    "primary": "#5f5e5e",
                    "surface-tint": "#5f5e5e",
                    "tertiary-fixed-dim": "#e7e5e4",
                    "primary-dim": "#535252",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#494a49",
                    "on-secondary": "#f9f9f8",
                    "on-primary-fixed-variant": "#5c5b5b",
                    "surface-container": "#ebeeef",
                    "background": "#f9f9f9",
                    "on-tertiary": "#fbf8f7",
                    "on-primary-container": "#525151",
                    "on-tertiary-fixed-variant": "#666665",
                    "on-error": "#fff7f6",
                    "surface-container-highest": "#dde4e5",
                    "secondary-fixed-dim": "#d4d4d3",
                    "on-primary": "#faf7f6",
                    "inverse-on-surface": "#9c9d9d",
                    "error-dim": "#4e0309",
                    "surface-container-high": "#e4e9ea",
                    "tertiary": "#5f5f5e",
                    "on-tertiary-container": "#5c5c5b",
                    "secondary-dim": "#525353",
                    "outline": "#757c7d",
                    "surface-variant": "#dde4e5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased min-h-screen">
<header class="fixed top-0 w-full z-50 bg-[#FAFAFA]/80 dark:bg-[#0A0A0A]/80 backdrop-blur-xl border-b-[0.5px] border-[#E7E5E4] dark:border-[#262626]">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<button class="text-[#0A0A0A] dark:text-[#FAFAFA] hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-inter font-medium text-lg text-[#0A0A0A] dark:text-[#FAFAFA] uppercase tracking-widest">Log walk</h1>
<div class="w-6"></div>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-screen-md mx-auto space-y-12">
<section class="space-y-8 bg-[#FFF9E6] border-[0.5px] border-[#FFECB3] rounded-xl p-6 shadow-sm">
<div class="space-y-4">
<div class="flex items-center justify-between">
<label class="font-headline font-medium text-[16px] text-[#7A5500]">Duration</label>
<span class="text-[#7A5500] opacity-70 font-medium text-[11px] uppercase">Minutes</span>
</div>
<input class="w-full bg-transparent border-b-[0.5px] border-[#7A5500] focus:border-[#7A5500] focus:ring-0 text-[28px] font-headline text-[#7A5500] py-2 px-0 placeholder:text-[#7A5500]/30 transition-colors" placeholder="0" type="number" value="45"/>
</div>
<div class="space-y-4">
<div class="flex items-center justify-between">
<label class="font-headline font-medium text-[16px] text-[#7A5500]">Distance</label>
<span class="text-[#7A5500] opacity-70 font-medium text-[11px] uppercase">Miles</span>
</div>
<input class="w-full bg-transparent border-b-[0.5px] border-[#7A5500] focus:border-[#7A5500] focus:ring-0 text-[28px] font-headline text-[#7A5500] py-2 px-0 placeholder:text-[#7A5500]/30 transition-colors" placeholder="0.0" step="0.1" type="number" value="2.1"/>
</div>
<div class="flex items-center justify-between pt-4 border-t-[0.5px] border-[#FFECB3]">
<label class="font-headline font-medium text-[14px] text-[#7A5500]">Auto from Health</label>
<button class="relative inline-flex h-6 w-11 items-center rounded-full bg-[#7A5500]">
<span class="translate-x-6 inline-block h-4 w-4 transform rounded-full bg-white transition"></span>
</button>
</div>
</section>
<section class="space-y-6">
<h2 class="font-headline font-medium text-[16px]">Energy level</h2>
<div class="grid grid-cols-3 gap-4">
<button class="flex flex-col items-center justify-center py-6 px-4 rounded-xl border-[0.5px] border-outline-variant bg-surface hover:bg-surface-container-low transition-colors space-y-2">
<span class="text-2xl">🥱</span>
<span class="font-headline font-medium text-[14px]">Low</span>
</button>
<button class="flex flex-col items-center justify-center py-6 px-4 rounded-xl border-[0.5px] border-on-background bg-surface-container-low transition-colors space-y-2">
<span class="text-2xl">🙂</span>
<span class="font-headline font-medium text-[14px]">Normal</span>
</button>
<button class="flex flex-col items-center justify-center py-6 px-4 rounded-xl border-[0.5px] border-outline-variant bg-surface hover:bg-surface-container-low transition-colors space-y-2">
<span class="text-2xl">⚡️</span>
<span class="font-headline font-medium text-[14px]">High</span>
</button>
</div>
</section>
<section class="space-y-6">
<div class="space-y-2">
<label class="font-headline font-medium text-[16px]">Notes</label>
<textarea class="w-full bg-surface border-[0.5px] border-outline-variant rounded-lg p-4 font-body text-[14px] text-on-background focus:border-on-background focus:ring-0 min-h-[120px] resize-none" placeholder="Any interesting sniffs?"></textarea>
</div>
<button class="w-full py-4 rounded-xl border-[0.5px] border-outline-variant bg-surface text-on-background font-headline font-medium text-[14px] flex items-center justify-center space-x-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera">photo_camera</span>
<span>Add Photo</span>
</button>
</section>
</main>
<div class="fixed bottom-0 w-full p-6 bg-gradient-to-t from-background via-background/90 to-transparent z-40">
<button class="w-full py-4 rounded-[14px] bg-[#0A0A0A] text-[#FAFAFA] font-headline font-medium text-[16px] shadow-[0_8px_32px_-4px_rgba(10,10,10,0.12)] hover:opacity-90 active:scale-[0.98] transition-all">
            Save event
        </button>
</div>
</body></html>
