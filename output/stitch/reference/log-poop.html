<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Poop Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#adb3b4",
                        "surface-dim": "#d4dbdd",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#2d3435",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-container": "#505252",
                        "secondary-container": "#e2e2e2",
                        "inverse-surface": "#0c0f0f",
                        "on-secondary-fixed": "#3e403f",
                        "secondary": "#5e5f5f",
                        "error-container": "#fe8983",
                        "on-primary-fixed": "#403f3f",
                        "primary-fixed-dim": "#d7d4d3",
                        "error": "#9f403d",
                        "primary-container": "#e5e2e1",
                        "surface": "#f9f9f9",
                        "on-surface-variant": "#5a6061",
                        "on-surface": "#2d3435",
                        "on-error-container": "#752121",
                        "surface-container-low": "#f2f4f4",
                        "on-secondary-fixed-variant": "#5a5c5b",
                        "inverse-primary": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#f5f3f2",
                        "tertiary-dim": "#535352",
                        "tertiary-fixed": "#f5f3f2",
                        "primary": "#5f5e5e",
                        "surface-tint": "#5f5e5e",
                        "tertiary-fixed-dim": "#e7e5e4",
                        "primary-dim": "#535252",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#494a49",
                        "on-secondary": "#f9f9f8",
                        "on-primary-fixed-variant": "#5c5b5b",
                        "surface-container": "#ebeeef",
                        "background": "#f9f9f9",
                        "on-tertiary": "#fbf8f7",
                        "on-primary-container": "#525151",
                        "on-tertiary-fixed-variant": "#666665",
                        "on-error": "#fff7f6",
                        "surface-container-highest": "#dde4e5",
                        "secondary-fixed-dim": "#d4d4d3",
                        "on-primary": "#faf7f6",
                        "inverse-on-surface": "#9c9d9d",
                        "error-dim": "#4e0309",
                        "surface-container-high": "#e4e9ea",
                        "tertiary": "#5f5f5e",
                        "on-tertiary-container": "#5c5c5b",
                        "secondary-dim": "#525353",
                        "outline": "#757c7d",
                        "surface-variant": "#dde4e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#FAFAFA]/80 dark:bg-[#0A0A0A]/80 backdrop-blur-xl border-b-[0.5px] border-[#E7E5E4] dark:border-[#262626]">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<button class="flex items-center justify-center p-2 -ml-2 text-[#0A0A0A] dark:text-[#FAFAFA] hover:opacity-70 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-inter font-medium text-lg text-[#0A0A0A] dark:text-[#FAFAFA] uppercase tracking-widest absolute left-1/2 -translate-x-1/2">BarkLog</h1>
<div class="w-10"></div> <!-- Placeholder for right alignment -->
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-lg mx-auto pt-24 px-6 pb-32">
<h2 class="text-[28px] font-medium leading-tight mb-8">Log poop</h2>
<div class="space-y-10">
<!-- When Section -->
<section>
<h3 class="text-[16px] font-medium mb-4">When</h3>
<div class="flex gap-3">
<button class="flex-1 py-3 px-4 rounded-[14px] bg-[#0A0A0A] text-[#FAFAFA] font-medium text-[14px] text-center border-[0.5px] border-[#0A0A0A]">
                        Just now
                    </button>
<button class="flex-1 py-3 px-4 rounded-[14px] bg-[#FAFAFA] text-[#0A0A0A] font-medium text-[14px] text-center border-[0.5px] border-[#E7E5E4]">
                        Earlier
                    </button>
</div>
</section>
<!-- Quality Section -->
<section>
<h3 class="text-[16px] font-medium mb-4">Quality</h3>
<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center gap-2 py-4 px-2 rounded-[14px] bg-[#F2F8F1] border-[0.5px] border-[#D9EAD3] text-[#1B5E20]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[14px] font-medium">Normal</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 py-4 px-2 rounded-[14px] bg-[#FAFAFA] border-[0.5px] border-[#E7E5E4] text-[#0A0A0A]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0;">waves</span>
<span class="text-[14px] font-medium">Loose</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 py-4 px-2 rounded-[14px] bg-[#FAFAFA] border-[0.5px] border-[#E7E5E4] text-[#0A0A0A]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">circle</span>
<span class="text-[14px] font-medium">Hard</span>
</button>
</div>
</section>
<!-- Color Section -->
<section>
<h3 class="text-[16px] font-medium mb-4">Color</h3>
<div class="flex justify-between gap-2">
<button class="w-12 h-12 rounded-full bg-[#8B5A2B] border-[0.5px] border-[#E7E5E4] flex items-center justify-center relative overflow-hidden">
<span class="absolute inset-0 ring-2 ring-offset-2 ring-[#0A0A0A] rounded-full m-1"></span>
</button>
<button class="w-12 h-12 rounded-full bg-[#4A3018] border-[0.5px] border-[#E7E5E4]"></button>
<button class="w-12 h-12 rounded-full bg-[#D4AF37] border-[0.5px] border-[#E7E5E4]"></button>
<button class="w-12 h-12 rounded-full bg-[#8C1D18] border-[0.5px] border-[#E7E5E4] flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">warning</span>
</button>
<button class="w-12 h-12 rounded-full bg-[#1A1A1A] border-[0.5px] border-[#E7E5E4] flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">warning</span>
</button>
</div>
</section>
<!-- Notes Section -->
<section>
<h3 class="text-[16px] font-medium mb-4">Notes</h3>
<textarea class="w-full bg-[#F5F5F4] border-b-[0.5px] border-[#0A0A0A] focus:border-b-[1px] focus:bg-[#FAFAFA] rounded-t-lg px-4 py-3 text-[14px] text-[#0A0A0A] placeholder:text-[#A8A29E] outline-none resize-none transition-all" placeholder="Any details..." rows="3"></textarea>
</section>
<!-- Photo Section -->
<section>
<button class="flex items-center gap-2 text-[#0A0A0A] font-medium text-[14px] py-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
                    Add photo
                </button>
</section>
</div>
</main>
<!-- Save FAB/Sticky Button Area -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#FAFAFA] to-transparent pointer-events-none">
<div class="max-w-lg mx-auto pointer-events-auto">
<button class="w-full py-4 rounded-[14px] bg-[#0A0A0A] text-[#FAFAFA] font-medium text-[16px] shadow-[0_0_32px_rgba(10,10,10,0.12)] hover:opacity-90 transition-opacity active:scale-[0.98]">
                Save event
            </button>
</div>
</div>
</body></html>
