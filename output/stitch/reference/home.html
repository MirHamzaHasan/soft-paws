<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarkLog Home Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#f5f3f2",
                        "tertiary": "#5f5f5e",
                        "secondary-dim": "#525353",
                        "on-secondary-fixed": "#3e403f",
                        "surface-container": "#ebeeef",
                        "primary-fixed": "#e5e2e1",
                        "on-secondary": "#f9f9f8",
                        "on-tertiary-container": "#5c5c5b",
                        "primary-dim": "#535252",
                        "primary-fixed-dim": "#d7d4d3",
                        "surface": "#f9f9f9",
                        "on-error": "#fff7f6",
                        "on-secondary-fixed-variant": "#5a5c5b",
                        "error-container": "#fe8983",
                        "secondary": "#5e5f5f",
                        "surface-container-low": "#f2f4f4",
                        "tertiary-fixed-dim": "#e7e5e4",
                        "secondary-fixed": "#e2e2e2",
                        "on-tertiary": "#fbf8f7",
                        "outline": "#757c7d",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed-variant": "#5c5b5b",
                        "surface-container-high": "#e4e9ea",
                        "on-error-container": "#752121",
                        "secondary-container": "#e2e2e2",
                        "on-surface-variant": "#5a6061",
                        "on-primary": "#faf7f6",
                        "surface-tint": "#5f5e5e",
                        "inverse-primary": "#ffffff",
                        "secondary-fixed-dim": "#d4d4d3",
                        "primary-container": "#e5e2e1",
                        "surface-variant": "#dde4e5",
                        "on-primary-container": "#525151",
                        "on-surface": "#2d3435",
                        "surface-container-highest": "#dde4e5",
                        "error": "#9f403d",
                        "on-primary-fixed": "#403f3f",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#5f5e5e",
                        "tertiary-dim": "#535352",
                        "on-background": "#2d3435",
                        "outline-variant": "#adb3b4",
                        "error-dim": "#4e0309",
                        "background": "#f9f9f9",
                        "on-tertiary-fixed-variant": "#666665",
                        "tertiary-fixed": "#f5f3f2",
                        "on-tertiary-fixed": "#494a49",
                        "surface-dim": "#d4dbdd",
                        "inverse-surface": "#0c0f0f",
                        "inverse-on-surface": "#9c9d9d",
                        "on-secondary-container": "#505252"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; color: #0A0A0A; }
        .hairline-border { border: 0.5px solid #E7E5E4; }
        .ink-text { color: #0A0A0A; }
        .paper-bg { background-color: #FAFAFA; }
        
        /* Semantic Event Classes from Design System */
        .event-poop { background-color: #FDF4F3; border: 0.5px solid #F9DEDC; color: #8C1D18; }
        .event-pee { background-color: #F0F4F8; border: 0.5px solid #D9E2EC; color: #102A43; }
        .event-meal { background-color: #F2F8F1; border: 0.5px solid #D9EAD3; color: #1B5E20; }
        .event-walk { background-color: #FFF9E6; border: 0.5px solid #FFECB3; color: #7A5500; }
        .event-meds { background-color: #F5F3FF; border: 0.5px solid #DDD6FE; color: #4C1D95; }
        
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen pb-24 flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#FAFAFA] dark:bg-stone-950 text-[#0A0A0A] dark:text-stone-50 font-inter font-medium text-base tracking-tight docked full-width top-0 sticky border-b-[0.5px] border-[#E7E5E4] dark:border-stone-800 flat no shadows z-40">
<div class="flex justify-between items-center px-6 py-4 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-3">
<img alt="Max" class="w-10 h-10 rounded-full object-cover hairline-border" data-alt="Close up profile picture of a happy golden retriever dog outdoors with soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA84kzCwvOKbO8I7A6GWfJL7WfEN1CgL_cl481O487YcoF6IS3oV3mhTFehmypAA6Ox5uJ1XYe9IOdbVsWfRHG4DUy8ZH2hMzTA4yHkTpdtw0R1d5EkRIwxAcjOQoGc6Y4n1lIKMOayXY1mUNYKu8dxCj8wieErRa21zUqmO9IvCuMfMeaspTIqfLvcHKaZBzdh5EwJj2XzDY3Cl9nSwd8Bq-hjjOYJAhvYfQZ6JYKTGlPNataOAxTkbFydUZf69Fbn1Ah7jc-o4SA"/>
<div>
<h1 class="text-[#0A0A0A] font-medium text-base tracking-tight">BarkLog</h1>
<p class="text-[11px] text-on-surface-variant font-medium">Max · Golden Retriever · 3y</p>
</div>
</div>
<button class="text-[#A8A29E] dark:text-stone-500 hover:opacity-70 transition-opacity Active: scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow px-6 py-8 max-w-screen-md mx-auto w-full flex flex-col gap-8">
<!-- Greeting -->
<section class="flex flex-col gap-1">
<h2 class="font-headline text-[1.75rem] font-medium tracking-[-0.02em] ink-text">Today.</h2>
<p class="text-body text-[14px] text-on-surface-variant">How is Max doing?</p>
</section>
<!-- Quick Log Actions - 2x2 Grid -->
<section class="grid grid-cols-2 gap-4">
<button class="event-poop rounded-[14px] p-6 flex flex-col items-center justify-center gap-3 hover:opacity-90 transition-opacity">
<span class="text-3xl">💩</span>
<span class="font-label text-[11px] uppercase tracking-wider font-medium">Poop</span>
</button>
<button class="event-pee rounded-[14px] p-6 flex flex-col items-center justify-center gap-3 hover:opacity-90 transition-opacity">
<span class="text-3xl">💦</span>
<span class="font-label text-[11px] uppercase tracking-wider font-medium">Pee</span>
</button>
<button class="event-meal rounded-[14px] p-6 flex flex-col items-center justify-center gap-3 hover:opacity-90 transition-opacity">
<span class="text-3xl">🦴</span>
<span class="font-label text-[11px] uppercase tracking-wider font-medium">Meal</span>
</button>
<button class="event-walk rounded-[14px] p-6 flex flex-col items-center justify-center gap-3 hover:opacity-90 transition-opacity">
<span class="text-3xl">🐾</span>
<span class="font-label text-[11px] uppercase tracking-wider font-medium">Walk</span>
</button>
</section>
<!-- Meds Button (Full Width) -->
<button class="event-meds rounded-[14px] p-4 flex items-center justify-between hover:opacity-90 transition-opacity w-full">
<div class="flex items-center gap-3">
<span class="text-2xl">💊</span>
<span class="font-label text-[14px] font-medium">Log Medication</span>
</div>
<span class="material-symbols-outlined text-sm">add</span>
</button>
<!-- Summary Card -->
<section class="bg-surface-container-low rounded-[14px] hairline-border p-6 flex flex-col gap-4 mt-2">
<h3 class="font-headline text-[16px] font-medium ink-text">Today's Summary</h3>
<div class="flex flex-col gap-2">
<p class="text-[14px] text-on-surface-variant">2 meals · 3 pees · 1 walk</p>
<div class="w-full h-[0.5px] bg-[#E7E5E4] my-2"></div>
<p class="text-[14px] text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                    Last entry: Walk at 14:30
                </p>
</div>
</section>
<!-- Safety & Emergency Links -->
<section class="flex flex-col gap-4 mt-8">
<button class="flex items-center justify-between py-3 hairline-border border-x-0 border-t-0 text-left hover:opacity-70">
<span class="font-medium text-[14px] text-on-surface-variant">Is this safe to eat?</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">chevron_right</span>
</button>
<button class="flex items-center justify-between py-3 hairline-border border-x-0 border-t-0 text-left hover:opacity-70 text-error">
<span class="font-medium text-[14px]">Emergency / SOS</span>
<span class="material-symbols-outlined text-[16px]">warning</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-[#FAFAFA]/80 dark:bg-stone-950/80 backdrop-blur-xl font-inter text-[11px] font-medium uppercase tracking-wider fixed bottom-0 w-full z-50 border-t-[0.5px] border-[#E7E5E4] dark:border-stone-800 flat no shadows flex justify-around items-center h-16 px-4 md:hidden pb-safe">
<!-- Active: Home -->
<button class="flex flex-col items-center justify-center text-[#0A0A0A] dark:text-stone-50 pb-safe hover:text-[#0A0A0A] dark:hover:text-stone-50 transition-colors tap-highlight-transparent gap-1">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span>Home</span>
</button>
<!-- Inactive: Timeline -->
<button class="flex flex-col items-center justify-center text-[#A8A29E] dark:text-stone-500 pb-safe hover:text-[#0A0A0A] dark:hover:text-stone-50 transition-colors tap-highlight-transparent gap-1">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span>Timeline</span>
</button>
<!-- Inactive: Insights -->
<button class="flex flex-col items-center justify-center text-[#A8A29E] dark:text-stone-500 pb-safe hover:text-[#0A0A0A] dark:hover:text-stone-50 transition-colors tap-highlight-transparent gap-1">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span>Insights</span>
</button>
<!-- Inactive: Profile -->
<button class="flex flex-col items-center justify-center text-[#A8A29E] dark:text-stone-500 pb-safe hover:text-[#0A0A0A] dark:hover:text-stone-50 transition-colors tap-highlight-transparent gap-1">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span>Profile</span>
</button>
</nav>
</body></html>
