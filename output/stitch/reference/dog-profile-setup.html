<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarkLog - Dog Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#e5e2e1",
                        "on-secondary": "#f9f9f8",
                        "on-background": "#2d3435",
                        "inverse-primary": "#ffffff",
                        "secondary-dim": "#525353",
                        "on-primary-fixed-variant": "#5c5b5b",
                        "on-primary-fixed": "#403f3f",
                        "primary-container": "#e5e2e1",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#f5f3f2",
                        "surface-container": "#ebeeef",
                        "surface-container-low": "#f2f4f4",
                        "error": "#9f403d",
                        "primary-dim": "#535252",
                        "primary": "#5f5e5e",
                        "secondary": "#5e5f5f",
                        "secondary-fixed-dim": "#d4d4d3",
                        "tertiary-fixed": "#f5f3f2",
                        "on-primary": "#faf7f6",
                        "on-error-container": "#752121",
                        "on-secondary-fixed": "#3e403f",
                        "surface-variant": "#dde4e5",
                        "primary-fixed-dim": "#d7d4d3",
                        "on-secondary-container": "#505252",
                        "on-surface": "#2d3435",
                        "surface": "#f9f9f9",
                        "outline": "#757c7d",
                        "on-primary-container": "#525151",
                        "secondary-container": "#e2e2e2",
                        "on-tertiary": "#fbf8f7",
                        "on-surface-variant": "#5a6061",
                        "on-secondary-fixed-variant": "#5a5c5b",
                        "inverse-on-surface": "#9c9d9d",
                        "surface-tint": "#5f5e5e",
                        "background": "#f9f9f9",
                        "tertiary": "#5f5f5e",
                        "surface-container-high": "#e4e9ea",
                        "error-dim": "#4e0309",
                        "tertiary-fixed-dim": "#e7e5e4",
                        "on-tertiary-fixed-variant": "#666665",
                        "outline-variant": "#adb3b4",
                        "on-tertiary-container": "#5c5c5b",
                        "error-container": "#fe8983",
                        "on-error": "#fff7f6",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d4dbdd",
                        "secondary-fixed": "#e2e2e2",
                        "inverse-surface": "#0c0f0f",
                        "tertiary-dim": "#535352",
                        "surface-container-highest": "#dde4e5",
                        "on-tertiary-fixed": "#494a49"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#FAFAFA] text-[#0A0A0A] antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Suppressed TopAppBar & BottomNavBar as this is an onboarding/transactional screen -->
<main class="w-full max-w-md bg-[#ffffff] rounded-xl border-[0.5px] border-[#E7E5E4] p-8 shadow-[0_4px_24px_rgba(10,10,10,0.02)]">
<!-- Progress Dots -->
<div class="flex items-center justify-center gap-2 mb-8">
<div class="w-2 h-2 rounded-full bg-[#0A0A0A]"></div>
<div class="w-2 h-2 rounded-full bg-[#E7E5E4]"></div>
<div class="w-2 h-2 rounded-full bg-[#E7E5E4]"></div>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="text-[28px] font-medium tracking-tight mb-2">Tell us about your dog</h1>
<p class="text-[14px] text-[#A8A29E] font-normal">Let's start building their living archive.</p>
</div>
<!-- Photo Upload -->
<div class="flex justify-center mb-8">
<button class="relative w-[72px] h-[72px] rounded-full bg-[#F5F5F4] border-[0.5px] border-[#E7E5E4] flex items-center justify-center hover:bg-[#E7E5E4] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0A0A0A]">
<span class="material-symbols-outlined text-[#0A0A0A]" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
</button>
</div>
<!-- Form Fields -->
<form class="space-y-6">
<!-- Name Input -->
<div class="space-y-1">
<label class="block text-[11px] font-medium uppercase tracking-wider text-[#0A0A0A]" for="dog-name">Name</label>
<input class="w-full bg-transparent border-0 border-b-[0.5px] border-[#E7E5E4] focus:border-[1px] focus:border-[#0A0A0A] focus:ring-0 px-0 py-2 text-[14px] font-normal placeholder-[#A8A29E]" id="dog-name" placeholder="e.g. Bella" type="text"/>
</div>
<!-- Breed Input -->
<div class="space-y-1 relative">
<label class="block text-[11px] font-medium uppercase tracking-wider text-[#0A0A0A]" for="dog-breed">Breed</label>
<input class="w-full bg-transparent border-0 border-b-[0.5px] border-[#E7E5E4] focus:border-[1px] focus:border-[#0A0A0A] focus:ring-0 px-0 py-2 text-[14px] font-normal placeholder-[#A8A29E] pr-8" id="dog-breed" placeholder="Search breed..." type="text"/>
<span class="material-symbols-outlined absolute right-0 top-6 text-[#A8A29E]" style="font-variation-settings: 'FILL' 0;">search</span>
</div>
<!-- Age & Weight Row -->
<div class="grid grid-cols-2 gap-6">
<!-- Age -->
<div class="space-y-1">
<label class="block text-[11px] font-medium uppercase tracking-wider text-[#0A0A0A]" for="dog-age">Age (Years)</label>
<input class="w-full bg-transparent border-0 border-b-[0.5px] border-[#E7E5E4] focus:border-[1px] focus:border-[#0A0A0A] focus:ring-0 px-0 py-2 text-[14px] font-normal placeholder-[#A8A29E]" id="dog-age" min="0" placeholder="0" type="number"/>
</div>
<!-- Weight -->
<div class="space-y-1">
<div class="flex items-center justify-between">
<label class="block text-[11px] font-medium uppercase tracking-wider text-[#0A0A0A]" for="dog-weight">Weight</label>
<div class="flex items-center text-[11px] font-medium text-[#A8A29E]">
<span class="text-[#0A0A0A]">lb</span>
<span class="mx-1">/</span>
<span>kg</span>
</div>
</div>
<input class="w-full bg-transparent border-0 border-b-[0.5px] border-[#E7E5E4] focus:border-[1px] focus:border-[#0A0A0A] focus:ring-0 px-0 py-2 text-[14px] font-normal placeholder-[#A8A29E]" id="dog-weight" min="0" placeholder="0.0" step="0.1" type="number"/>
</div>
</div>
<!-- Sex Selector -->
<div class="space-y-3">
<label class="block text-[11px] font-medium uppercase tracking-wider text-[#0A0A0A]">Sex &amp; Status</label>
<div class="grid grid-cols-2 gap-3">
<button class="py-2 text-[14px] font-normal border-[0.5px] border-[#0A0A0A] rounded-[14px] bg-[#FAFAFA] text-[#0A0A0A] hover:bg-[#F5F5F4] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0A0A0A]" type="button">Male</button>
<button class="py-2 text-[14px] font-normal border-[0.5px] border-[#E7E5E4] rounded-[14px] bg-[#FAFAFA] text-[#A8A29E] hover:bg-[#F5F5F4] hover:text-[#0A0A0A] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0A0A0A]" type="button">Female</button>
<button class="py-2 text-[14px] font-normal border-[0.5px] border-[#E7E5E4] rounded-[14px] bg-[#FAFAFA] text-[#A8A29E] hover:bg-[#F5F5F4] hover:text-[#0A0A0A] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0A0A0A]" type="button">Neutered</button>
<button class="py-2 text-[14px] font-normal border-[0.5px] border-[#E7E5E4] rounded-[14px] bg-[#FAFAFA] text-[#A8A29E] hover:bg-[#F5F5F4] hover:text-[#0A0A0A] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0A0A0A]" type="button">Spayed</button>
</div>
</div>
<!-- Actions -->
<div class="pt-6 mt-6 border-t-[0.5px] border-[#E7E5E4]">
<button class="w-full py-4 bg-[#0A0A0A] text-[#FAFAFA] text-[16px] font-medium rounded-[14px] hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0A0A0A]" type="button">
                    Next
                </button>
</div>
</form>
</main>
</body></html>
