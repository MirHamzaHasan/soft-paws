<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarkLog - Add Another Dog</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#fbf8f7",
                        "on-surface-variant": "#5a6061",
                        "secondary-container": "#e2e2e2",
                        "surface-container-high": "#e4e9ea",
                        "tertiary": "#5f5f5e",
                        "surface-tint": "#5f5e5e",
                        "background": "#f9f9f9",
                        "inverse-on-surface": "#9c9d9d",
                        "on-secondary-fixed-variant": "#5a5c5b",
                        "surface-variant": "#dde4e5",
                        "primary-fixed-dim": "#d7d4d3",
                        "on-secondary-fixed": "#3e403f",
                        "on-primary": "#faf7f6",
                        "on-error-container": "#752121",
                        "on-primary-container": "#525151",
                        "surface": "#f9f9f9",
                        "outline": "#757c7d",
                        "on-surface": "#2d3435",
                        "on-secondary-container": "#505252",
                        "secondary-fixed": "#e2e2e2",
                        "surface-container-highest": "#dde4e5",
                        "on-tertiary-fixed": "#494a49",
                        "tertiary-dim": "#535352",
                        "inverse-surface": "#0c0f0f",
                        "on-tertiary-container": "#5c5c5b",
                        "outline-variant": "#adb3b4",
                        "tertiary-fixed-dim": "#e7e5e4",
                        "on-tertiary-fixed-variant": "#666665",
                        "error-dim": "#4e0309",
                        "surface-dim": "#d4dbdd",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#fff7f6",
                        "error-container": "#fe8983",
                        "secondary-dim": "#525353",
                        "inverse-primary": "#ffffff",
                        "on-background": "#2d3435",
                        "surface-bright": "#f9f9f9",
                        "primary-container": "#e5e2e1",
                        "on-primary-fixed": "#403f3f",
                        "on-primary-fixed-variant": "#5c5b5b",
                        "on-secondary": "#f9f9f8",
                        "primary-fixed": "#e5e2e1",
                        "primary-dim": "#535252",
                        "primary": "#5f5e5e",
                        "error": "#9f403d",
                        "tertiary-fixed": "#f5f3f2",
                        "secondary-fixed-dim": "#d4d4d3",
                        "secondary": "#5e5f5f",
                        "surface-container-low": "#f2f4f4",
                        "surface-container": "#ebeeef",
                        "tertiary-container": "#f5f3f2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        /* Specific overrides for the design system */
        body { font-family: 'Inter', sans-serif; font-weight: 400; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Auto-suppression of Navigation: 
           As per guidelines, transactional pages (Add Dog) must NOT show standard navigation.
           Therefore, BottomNavBar and global TopAppBar are explicitly excluded from this layout. */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col selection:bg-surface-container-highest">
<!-- Minimal Contextual Header for Transactional Flow -->
<header class="w-full px-6 py-6 flex items-center justify-between z-50 sticky top-0 bg-background/90 backdrop-blur-md">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors text-on-surface" type="button">
<span class="material-symbols-outlined text-[1.5rem]">close</span>
</button>
<!-- Spacer to keep close button left-aligned without absolute positioning -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-6 pb-32">
<h1 class="text-[1.75rem] font-medium tracking-tight mb-12">Add another dog</h1>
<!-- Photo Upload Asymmetric Layout -->
<div class="flex justify-start mb-12 ml-2">
<div class="relative group cursor-pointer flex flex-col items-center">
<div class="w-32 h-32 rounded-full bg-surface-container-low flex items-center justify-center border-[0.5px] border-[#E7E5E4] overflow-hidden relative shadow-sm">
<!-- Placeholder Icon -->
<span class="material-symbols-outlined text-outline-variant text-[2rem]">add_a_photo</span>
<!-- Hover/Active Overlay -->
<div class="absolute inset-0 bg-on-surface/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
<span class="text-[0.6875rem] font-medium uppercase tracking-widest text-on-surface">Upload</span>
</div>
</div>
</div>
</div>
<!-- Details Form -->
<form class="space-y-10">
<!-- Name Field -->
<div class="relative group">
<label class="text-[0.6875rem] font-medium uppercase tracking-widest text-outline block mb-2 transition-colors group-focus-within:text-on-surface">Name</label>
<input class="w-full bg-transparent border-b-[0.5px] border-[#E7E5E4] text-[0.875rem] py-2 focus:outline-none focus:border-on-surface focus:border-b-[1px] transition-all placeholder:text-outline-variant/60" placeholder="e.g. Bella" type="text"/>
</div>
<!-- Breed Field -->
<div class="relative group">
<label class="text-[0.6875rem] font-medium uppercase tracking-widest text-outline block mb-2 transition-colors group-focus-within:text-on-surface">Breed</label>
<input class="w-full bg-transparent border-b-[0.5px] border-[#E7E5E4] text-[0.875rem] py-2 focus:outline-none focus:border-on-surface focus:border-b-[1px] transition-all placeholder:text-outline-variant/60" placeholder="e.g. Golden Retriever" type="text"/>
</div>
<!-- Age & Weight Grid -->
<div class="grid grid-cols-2 gap-8">
<!-- Age Field -->
<div class="relative group">
<label class="text-[0.6875rem] font-medium uppercase tracking-widest text-outline block mb-2 transition-colors group-focus-within:text-on-surface">Age</label>
<input class="w-full bg-transparent border-b-[0.5px] border-[#E7E5E4] text-[0.875rem] py-2 focus:outline-none focus:border-on-surface focus:border-b-[1px] transition-all placeholder:text-outline-variant/60" placeholder="Yrs / Mos" type="text"/>
</div>
<!-- Weight Field -->
<div class="relative group">
<label class="text-[0.6875rem] font-medium uppercase tracking-widest text-outline block mb-2 transition-colors group-focus-within:text-on-surface">Weight</label>
<input class="w-full bg-transparent border-b-[0.5px] border-[#E7E5E4] text-[0.875rem] py-2 focus:outline-none focus:border-on-surface focus:border-b-[1px] transition-all placeholder:text-outline-variant/60" placeholder="kg or lbs" type="text"/>
</div>
</div>
<!-- Sex Selection (Tactile Toggle) -->
<div class="relative pt-2">
<label class="text-[0.6875rem] font-medium uppercase tracking-widest text-outline block mb-4">Sex</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="dog_sex" type="radio" value="male"/>
<div class="text-center py-3 rounded-[14px] border-[0.5px] border-[#E7E5E4] text-[0.875rem] text-outline bg-surface-container-lowest peer-checked:bg-on-surface peer-checked:text-on-primary peer-checked:border-on-surface transition-all active:scale-[0.98]">
                            Male
                        </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="dog_sex" type="radio" value="female"/>
<div class="text-center py-3 rounded-[14px] border-[0.5px] border-[#E7E5E4] text-[0.875rem] text-outline bg-surface-container-lowest peer-checked:bg-on-surface peer-checked:text-on-primary peer-checked:border-on-surface transition-all active:scale-[0.98]">
                            Female
                        </div>
</label>
</div>
</div>
</form>
</main>
<!-- Floating Action Button Area -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-background via-background/90 to-transparent z-40 pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button class="w-full bg-on-surface text-on-primary py-4 rounded-[14px] font-medium text-[0.875rem] tracking-wide hover:opacity-90 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2" type="button">
                Add Dog
            </button>
</div>
</div>
</body></html>
