<style>
        body {
            background-color: theme('colors.paper');
            color: theme('colors.ink');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

            border-width: 0.5px;
            border-color: theme('colors.hairline');
        }

            border-bottom-width: 0.5px;

        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col font-body selection:bg-surface-tone">
<!-- Top Navigation (Contextual departure, hiding main navs, providing back action) -->
<header class="w-full max-w-screen-xl mx-auto px-6 py-4 flex items-center justify-between z-10 sticky top-0 bg-paper">
<a aria-label="Go back" class="flex items-center text-ink hover:opacity-70 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-size: 24px; font-weight: 400;">arrow_back</span>
</a>
<!-- Empty div to balance flex-between if needed, or omit -->
<div></div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center px-6 max-w-md mx-auto w-full pb-20">
<!-- Header Section -->
<div class="mb-10 text-left">
<h1 class="font-headline font-medium text-[28px] tracking-tight text-ink mb-2">Reset password</h1>
<p class="font-body text-[14px] text-on-surface-variant font-normal leading-relaxed">
                We'll send a reset link to your email.
            </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-8 w-full">
<!-- Email Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label text-[11px] uppercase tracking-wider font-medium text-ink" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-tone border-0 border-b-hairline border-hairline px-4 py-3 text-[14px] font-body text-ink placeholder-outline focus:ring-0 focus:border-ink transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Action Area -->
<div class="pt-4">
<button class="w-full bg-ink text-paper font-headline font-medium text-[16px] py-4 rounded-[14px] hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="button">
                    Send reset link
                </button>
</div>
</form>
<!-- Success State Variant (Hidden by default, shown here for demonstration of the required state) -->
<!-- In a real app, this would replace the form or be shown conditionally -->
<div class="mt-16 p-6 bg-surface-container-low border-hairline rounded-[14px] hidden">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-[#F2F8F1] border border-[#D9EAD3] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#1B5E20]" style="font-size: 20px;">check</span>
</div>
<div>
<h3 class="font-headline font-medium text-[16px] text-ink mb-1">Check your email</h3>
<p class="font-body text-[14px] text-on-surface-variant leading-relaxed">
                        We've sent a password reset link to your email address. Please check your inbox and spam folder.
                    </p>
</div>
</div>
</div>
</main>
