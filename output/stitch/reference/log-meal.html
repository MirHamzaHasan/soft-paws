<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarkLog - Log Meal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#adb3b4",
                        "surface-dim": "#d4dbdd",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#2d3435",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-container": "#505252",
                        "secondary-container": "#e2e2e2",
                        "inverse-surface": "#0c0f0f",
                        "on-secondary-fixed": "#3e403f",
                        "secondary": "#5e5f5f",
                        "error-container": "#fe8983",
                        "on-primary-fixed": "#403f3f",
                        "primary-fixed-dim": "#d7d4d3",
                        "error": "#9f403d",
                        "primary-container": "#e5e2e1",
                        "surface": "#f9f9f9",
                        "on-surface-variant": "#5a6061",
                        "on-surface": "#2d3435",
                        "on-error-container": "#752121",
                        "surface-container-low": "#f2f4f4",
                        "on-secondary-fixed-variant": "#5a5c5b",
                        "inverse-primary": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#f5f3f2",
                        "tertiary-dim": "#535352",
                        "tertiary-fixed": "#f5f3f2",
                        "primary": "#5f5e5e",
                        "surface-tint": "#5f5e5e",
                        "tertiary-fixed-dim": "#e7e5e4",
                        "primary-dim": "#535252",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#494a49",
                        "on-secondary": "#f9f9f8",
                        "on-primary-fixed-variant": "#5c5b5b",
                        "surface-container": "#ebeeef",
                        "background": "#f9f9f9",
                        "on-tertiary": "#fbf8f7",
                        "on-primary-container": "#525151",
                        "on-tertiary-fixed-variant": "#666665",
                        "on-error": "#fff7f6",
                        "surface-container-highest": "#dde4e5",
                        "secondary-fixed-dim": "#d4d4d3",
                        "on-primary": "#faf7f6",
                        "inverse-on-surface": "#9c9d9d",
                        "error-dim": "#4e0309",
                        "surface-container-high": "#e4e9ea",
                        "tertiary": "#5f5f5e",
                        "on-tertiary-container": "#5c5c5b",
                        "secondary-dim": "#525353",
                        "outline": "#757c7d",
                        "surface-variant": "#dde4e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; color: #0A0A0A; }
        .hairline-b { border-bottom: 0.5px solid #E7E5E4; }
        .hairline { border: 0.5px solid #E7E5E4; }
        .hairline-ink { border-bottom: 0.5px solid #0A0A0A; }
        .focus-hairline:focus-within { border-bottom: 1px solid #0A0A0A; }
        
        /* Event Tone - Meal */
        .event-meal-bg { background-color: #F2F8F1; }
        .event-meal-border { border: 0.5px solid #D9EAD3; }
        .event-meal-text { color: #1B5E20; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#FAFAFA]/80 backdrop-blur-xl border-b-[0.5px] border-[#E7E5E4]">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<button aria-label="Go back" class="text-[#0A0A0A] hover:opacity-70 transition-opacity flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-inter font-medium text-lg text-[#0A0A0A] uppercase tracking-widest">Log Meal</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-6 max-w-xl mx-auto flex flex-col gap-8">
<!-- Time Entry (Editorial Stamp style) -->
<section class="flex flex-col gap-2">
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter text-[#A8A29E]">When</span>
<div class="flex items-center gap-4">
<button class="text-[28px] font-medium tracking-tight text-[#0A0A0A] focus:outline-none flex items-center gap-2">
                    Today, 8:30 AM
                    <span class="material-symbols-outlined text-[20px] text-[#A8A29E]" data-icon="edit_calendar">edit_calendar</span>
</button>
</div>
</section>
<!-- Meal Type Pills -->
<section class="flex flex-col gap-4">
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter text-[#A8A29E]">Meal Type</span>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-2.5 rounded-full event-meal-bg event-meal-border event-meal-text font-medium text-sm transition-transform active:scale-95 flex items-center gap-2">
<span>🦴</span> Breakfast
                </button>
<button class="px-5 py-2.5 rounded-full bg-surface hairline text-on-surface font-medium text-sm transition-transform active:scale-95">
                    Lunch
                </button>
<button class="px-5 py-2.5 rounded-full bg-surface hairline text-on-surface font-medium text-sm transition-transform active:scale-95">
                    Dinner
                </button>
<button class="px-5 py-2.5 rounded-full bg-surface hairline text-on-surface font-medium text-sm transition-transform active:scale-95">
                    Snack
                </button>
<button class="px-5 py-2.5 rounded-full bg-surface hairline text-on-surface font-medium text-sm transition-transform active:scale-95 flex items-center gap-2">
<span>🥓</span> Treat
                </button>
</div>
</section>
<!-- Amount Input -->
<section class="flex flex-col gap-4 pt-4">
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter text-[#A8A29E]">Amount</span>
<div class="flex items-end gap-6 relative">
<div class="flex-1 hairline-ink focus-hairline pb-2 flex items-center">
<input class="w-full bg-transparent border-none p-0 text-[28px] font-medium tracking-tight placeholder:text-[#A8A29E] focus:ring-0 text-[#0A0A0A]" placeholder="0.0" type="number" value="1.5"/>
</div>
<div class="flex bg-surface rounded-lg hairline overflow-hidden mb-2">
<button class="px-4 py-2 bg-[#0A0A0A] text-[#FAFAFA] text-xs font-medium">Cups</button>
<button class="px-4 py-2 text-[#0A0A0A] text-xs font-medium hover:bg-surface-container-low transition-colors">Grams</button>
</div>
</div>
</section>
<!-- Food Brand (Autocomplete style) -->
<section class="flex flex-col gap-4 pt-4">
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter text-[#A8A29E]">Food Brand</span>
<div class="relative">
<div class="hairline-ink focus-hairline pb-2 flex items-center">
<span class="material-symbols-outlined text-[#A8A29E] mr-3" data-icon="search">search</span>
<input class="w-full bg-transparent border-none p-0 text-base font-normal text-[#0A0A0A] placeholder:text-[#A8A29E] focus:ring-0" placeholder="Search brand or recipe..." type="text" value="Orijen Regional Red"/>
</div>
<!-- Suggestions Box (simulated) -->
<div class="absolute top-full left-0 w-full mt-1 bg-surface-container-lowest hairline rounded-lg shadow-[0_4px_24px_rgba(10,10,10,0.04)] z-10 p-2 hidden">
<button class="w-full text-left px-3 py-2.5 text-sm rounded-md hover:bg-surface-container-low transition-colors text-on-surface">Orijen Original</button>
<button class="w-full text-left px-3 py-2.5 text-sm rounded-md hover:bg-surface-container-low transition-colors text-on-surface">Orijen Regional Red</button>
<button class="w-full text-left px-3 py-2.5 text-sm rounded-md hover:bg-surface-container-low transition-colors text-on-surface">Orijen Six Fish</button>
</div>
</div>
</section>
<!-- Notes Area -->
<section class="flex flex-col gap-4 pt-4">
<span class="font-inter font-medium text-[11px] uppercase tracking-tighter text-[#A8A29E]">Notes</span>
<div class="bg-surface rounded-xl hairline p-4 focus-within:bg-surface-bright transition-colors">
<textarea class="w-full bg-transparent border-none p-0 text-sm font-normal text-[#0A0A0A] placeholder:text-[#A8A29E] focus:ring-0 resize-none" placeholder="Added some pumpkin today..." rows="3"></textarea>
<!-- Action Bar within Notes -->
<div class="flex justify-between items-center mt-3 pt-3 border-t-[0.5px] border-[#E7E5E4]">
<button class="flex items-center gap-2 text-xs font-medium text-[#0A0A0A] hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[18px]" data-icon="add_a_photo">add_a_photo</span>
                        Add Photo
                    </button>
</div>
</div>
</section>
<!-- Primary Action -->
<div class="pt-8 pb-8">
<button class="w-full bg-[#0A0A0A] text-[#FAFAFA] rounded-[14px] py-4 font-medium text-base tracking-tight hover:opacity-90 transition-opacity active:scale-[0.98]">
                Save Meal
            </button>
</div>
</main>
<!-- Navigation suppressed as this is a transactional flow -->
</body></html>
