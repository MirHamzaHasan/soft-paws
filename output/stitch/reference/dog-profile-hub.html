<div>

<section class="grid grid-cols-3 gap-3">

<div class="bg-surface-container-low border-[0.5px] border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-1">

<span class="font-headline font-medium text-[16px] text-on-background">3,104</span>

<span class="material-symbols-outlined text-[#7A5500] text-[18px]" data-icon="warning">warning</span>

<button class="flex items-center justify-center gap-2 w-full py-2 mt-1 text-[14px] font-medium text-secondary hover:text-on-background transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="add">add</span>
                        Add Medication

</div>
</div>

<span class="font-headline font-medium text-[16px] text-on-background">Grooming</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest border-[0.5px] border-outline-variant rounded-xl hover:bg-surface-bright transition-colors text-left shadow-sm">

<span class="material-symbols-outlined text-secondary text-[20px]" data-icon="coronavirus">coronavirus</span>
<span class="font-headline font-medium text-[16px] text-on-background">Allergies</span>

<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>

<span class="font-headline font-medium text-[16px] text-on-background">Vet Info</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
