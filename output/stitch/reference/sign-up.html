<!DOCTYPE html>

<html class="light" lang="en"><head>

<title>BarkLog - Create Account</title>

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .border-hairline { border-width: 0.5px; }
        .border-t-hairline { border-top-width: 0.5px; }

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-[#FAFAFA] text-[#0A0A0A] min-h-screen flex flex-col antialiased selection:bg-[#F5F5F4] selection:text-[#0A0A0A]">
<!-- TopAppBar equivalent for standalone page -->
<header class="flex items-center px-6 py-4 w-full max-w-screen-xl mx-auto h-16 sticky top-0 bg-[#FAFAFA] z-50 border-b-hairline border-[#E7E5E4]">
<a aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 text-[#0A0A0A] hover:opacity-70 transition-opacity rounded-full" href="#">
<span class="material-symbols-outlined" style="font-weight: 300;">arrow_back</span>
</a>
</header>
<main class="flex-1 flex flex-col px-6 py-12 max-w-md mx-auto w-full">
<div class="mb-12">
<h1 class="font-headline text-[28px] leading-tight font-medium tracking-tight mb-2 text-[#0A0A0A]">Create your account</h1>
<p class="font-body text-[14px] font-normal text-[#A8A29E]">Join The Living Archive to start logging.</p>
</div>
<form class="flex flex-col gap-6 flex-1">
<div class="flex flex-col gap-1.5 relative group">
<label class="font-label text-[11px] font-medium uppercase tracking-wider text-[#A8A29E] pl-1" for="email">Email Address</label>
<div class="relative flex items-center bg-[#F5F5F4] rounded-xl overflow-hidden transition-all duration-200 focus-within:bg-[#FAFAFA] focus-within:ring-1 focus-within:ring-[#0A0A0A]">
<span class="material-symbols-outlined absolute left-4 text-[#A8A29E]" style="font-weight: 300; font-size: 20px;">mail</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-[14px] font-body font-normal text-[#0A0A0A] placeholder:text-[#A8A29E] focus:ring-0" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5 relative group">
<label class="font-label text-[11px] font-medium uppercase tracking-wider text-[#A8A29E] pl-1" for="password">Password</label>
<div class="relative flex items-center bg-[#F5F5F4] rounded-xl overflow-hidden transition-all duration-200 focus-within:bg-[#FAFAFA] focus-within:ring-1 focus-within:ring-[#0A0A0A]">
<span class="material-symbols-outlined absolute left-4 text-[#A8A29E]" style="font-weight: 300; font-size: 20px;">lock</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-12 text-[14px] font-body font-normal text-[#0A0A0A] placeholder:text-[#A8A29E] focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-[#A8A29E] hover:text-[#0A0A0A] transition-colors flex items-center justify-center h-full" type="button">
<span class="material-symbols-outlined" style="font-weight: 300; font-size: 20px;">visibility_off</span>
</button>
</div>
<p class="font-body text-[11px] text-[#A8A29E] mt-1 pl-1">Must be at least 8 characters.</p>
</div>
<div class="mt-8 flex flex-col gap-4">
<button class="w-full bg-[#0A0A0A] text-[#FAFAFA] py-4 rounded-[14px] font-body text-[14px] font-medium hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2" type="submit">
                    Continue
                    <span class="material-symbols-outlined" style="font-size: 18px; font-weight: 400;">arrow_forward</span>
</button>
<div class="text-center mt-4">
<p class="font-body text-[14px] text-[#A8A29E]">
                        Already have an account? 
                        <a class="text-[#0A0A0A] font-medium border-b-hairline border-[#0A0A0A] pb-0.5 hover:opacity-70 transition-opacity" href="#">Sign in</a>
</p>
</div>
</div>
</form>
</main>
</body></html>
