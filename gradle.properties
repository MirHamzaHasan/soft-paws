# Native Release devirtualization for the complete Compose screen set exceeds 3 GiB.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
compose.ios.resources.sync=true
# Preserve the pre-2.3.20 Native collector. CMS caused the profiled Release
# compiler stall in StaticInitializersOptimization (JetBrains KT-84412).
kotlin.native.binary.gc=pmcs
